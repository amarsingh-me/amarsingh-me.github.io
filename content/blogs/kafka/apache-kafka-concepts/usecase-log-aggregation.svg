<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="420" fill="#fdfcf9"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Centralized Log Aggregation</text>

  <!-- services -->
  <rect x="30" y="70" width="130" height="45" rx="7" fill="#f1e6de" stroke="#9a3324" stroke-width="2"/>
  <text x="95" y="98" text-anchor="middle" font-size="13" fill="#1a1a1a">Service A</text>
  <rect x="30" y="140" width="130" height="45" rx="7" fill="#f1e6de" stroke="#9a3324" stroke-width="2"/>
  <text x="95" y="168" text-anchor="middle" font-size="13" fill="#1a1a1a">Service B</text>
  <rect x="30" y="210" width="130" height="45" rx="7" fill="#f1e6de" stroke="#9a3324" stroke-width="2"/>
  <text x="95" y="238" text-anchor="middle" font-size="13" fill="#1a1a1a">Service C</text>
  <rect x="30" y="280" width="130" height="45" rx="7" fill="#f1e6de" stroke="#9a3324" stroke-width="2"/>
  <text x="95" y="308" text-anchor="middle" font-size="13" fill="#1a1a1a">Service D</text>

  <!-- kafka -->
  <rect x="300" y="150" width="200" height="110" rx="10" fill="#fff" stroke="#9a3324" stroke-width="2.5"/>
  <text x="400" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3324">Kafka</text>
  <text x="400" y="200" text-anchor="middle" font-size="12" fill="#5a5a5a">topic: logs</text>
  <line x1="320" y1="215" x2="480" y2="215" stroke="#d8d3c8" stroke-width="2"/>
  <line x1="320" y1="230" x2="480" y2="230" stroke="#d8d3c8" stroke-width="2"/>

  <!-- store -->
  <g>
    <ellipse cx="695" cy="180" rx="75" ry="18" fill="#f1e6de" stroke="#9a3324" stroke-width="2"/>
    <rect x="620" y="180" width="150" height="60" fill="#f1e6de" stroke="#9a3324" stroke-width="2"/>
    <ellipse cx="695" cy="240" rx="75" ry="18" fill="#f1e6de" stroke="#9a3324" stroke-width="2"/>
    <line x1="620" y1="180" x2="620" y2="240" stroke="#9a3324" stroke-width="2"/>
    <line x1="770" y1="180" x2="770" y2="240" stroke="#9a3324" stroke-width="2"/>
  </g>
  <text x="695" y="290" text-anchor="middle" font-size="13" fill="#1a1a1a">Central log store</text>
  <text x="695" y="306" text-anchor="middle" font-size="11" fill="#5a5a5a">(ELK / S3 / data lake)</text>

  <!-- arrows -->
  <line x1="160" y1="92" x2="296" y2="175" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="160" y1="162" x2="296" y2="192" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="160" y1="232" x2="296" y2="212" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="160" y1="302" x2="296" y2="225" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="500" y1="205" x2="616" y2="205" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrow2)"/>

  <text x="400" y="380" text-anchor="middle" font-size="12" fill="#5a5a5a">Kafka buffers bursty log volume so the store never sees the raw spike</text>
</svg>
