<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="420" fill="#fdfcf9"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Real-Time Stream Processing</text>

  <!-- input topic -->
  <rect x="30" y="160" width="150" height="70" rx="10" fill="#fff" stroke="#9a3324" stroke-width="2.5"/>
  <text x="105" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3324">Input topic</text>
  <text x="105" y="206" text-anchor="middle" font-size="11" fill="#5a5a5a">raw-clicks</text>
  <line x1="45" y1="215" x2="165" y2="215" stroke="#d8d3c8" stroke-width="2"/>

  <!-- processor -->
  <rect x="260" y="130" width="220" height="130" rx="10" fill="#f6f1e7" stroke="#9a3324" stroke-width="2"/>
  <text x="370" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Kafka Streams / ksqlDB</text>
  <text x="370" y="178" text-anchor="middle" font-size="11" fill="#5a5a5a">filter → group → window</text>

  <g>
    <ellipse cx="370" cy="215" rx="55" ry="14" fill="#f1e6de" stroke="#9a3324" stroke-width="1.5"/>
    <rect x="315" y="215" width="110" height="30" fill="#f1e6de" stroke="#9a3324" stroke-width="1.5"/>
    <ellipse cx="370" cy="245" rx="55" ry="14" fill="#f1e6de" stroke="#9a3324" stroke-width="1.5"/>
    <line x1="315" y1="215" x2="315" y2="245" stroke="#9a3324" stroke-width="1.5"/>
    <line x1="425" y1="215" x2="425" y2="245" stroke="#9a3324" stroke-width="1.5"/>
  </g>
  <text x="370" y="219" text-anchor="middle" font-size="10" fill="#1a1a1a"></text>
  <text x="370" y="270" text-anchor="middle" font-size="10" fill="#5a5a5a">local state store</text>

  <!-- changelog -->
  <rect x="260" y="20" width="220" height="45" rx="8" fill="#f1e6de" stroke="#9a3324" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="370" y="47" text-anchor="middle" font-size="12" fill="#5a5a5a">changelog topic (compacted backup)</text>
  <line x1="370" y1="65" x2="370" y2="126" stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow5)"/>
  <line x1="360" y1="126" x2="360" y2="65" stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow5)"/>

  <!-- output topic -->
  <rect x="590" y="160" width="180" height="70" rx="10" fill="#fff" stroke="#9a3324" stroke-width="2.5"/>
  <text x="680" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3324">Output topic</text>
  <text x="680" y="206" text-anchor="middle" font-size="11" fill="#5a5a5a">clicks-per-minute</text>
  <line x1="605" y1="215" x2="755" y2="215" stroke="#d8d3c8" stroke-width="2"/>

  <!-- dashboard -->
  <rect x="620" y="290" width="140" height="50" rx="7" fill="#f1e6de" stroke="#9a3324" stroke-width="2"/>
  <text x="690" y="320" text-anchor="middle" font-size="13" fill="#1a1a1a">Live dashboard</text>

  <!-- arrows -->
  <line x1="180" y1="195" x2="256" y2="195" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="480" y1="195" x2="586" y2="195" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="680" y1="230" x2="690" y2="286" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrow5)"/>

  <text x="400" y="390" text-anchor="middle" font-size="12" fill="#5a5a5a">continuous transformation — no batch job, no nightly cron</text>
</svg>
