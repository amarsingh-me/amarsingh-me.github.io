{{ $data := .Inner | string | transform.Unmarshal }}
{{ $uid := partial "functions/uid.html" . }}
<div class="not-prose my-6 rounded-md border border-neutral-200 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-800 p-4">
  <svg id="moving-diagram-{{ $uid }}" viewBox="{{ $data.viewBox | default "0 0 800 400" }}" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="{{ with $data.ariaLabel }}{{ . }}{{ else }}{{ $data.title }}: {{ $data.subtitle }}{{ end }}" class="w-full h-auto block">
    <defs>
      <filter id="glow-{{ $uid }}" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
    </defs>

    <g id="wires-{{ $uid }}" stroke-width="1.5" fill="none"></g>
    <polyline id="trail-{{ $uid }}" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <g id="boxes-{{ $uid }}"></g>

    <g id="dot-{{ $uid }}" visibility="hidden">
      <circle id="dotglow-{{ $uid }}" r="11" opacity="0.7" filter="url(#glow-{{ $uid }})"/>
      <circle id="dotbody-{{ $uid }}" r="5"/>
      <circle r="2" fill="white"/>
      <text id="dotlabel-{{ $uid }}" y="-14" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace"></text>
    </g>

    {{ with $data.title }}
    <text x="400" y="{{ $data.titleY | default 330 }}" font-size="26" font-weight="700" text-anchor="middle"
          id="title-{{ $uid }}" font-family="ui-sans-serif, system-ui, sans-serif">{{ . }}</text>
    {{ end }}
    {{ with $data.subtitle }}
    <text x="400" y="{{ $data.subtitleY | default 354 }}" font-size="14" text-anchor="middle"
          id="subtitle-{{ $uid }}" font-family="ui-sans-serif, system-ui, sans-serif">{{ . }}</text>
    {{ end }}

    <rect id="capbox-{{ $uid }}" y="{{ $data.captionY | default 372 }}" height="34" rx="17"/>
    <text id="caption-{{ $uid }}" x="400" y="{{ (add ($data.captionY | default 372) 22) }}" font-size="14" text-anchor="middle"
          font-family="ui-monospace, monospace"></text>
  </svg>
</div>
<script type="application/json" id="moving-diagram-{{ $uid }}-config">{{ $data | jsonify | safeJS }}</script>
<script type="text/javascript">
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const uid = "{{ $uid }}";
  const cfg = JSON.parse(document.getElementById("moving-diagram-" + uid + "-config").textContent);
  const root = document.documentElement;

  function raw(name) { return getComputedStyle(root).getPropertyValue(name).trim(); }
  function rgb(name) { return "rgb(" + raw(name) + ")"; }
  function triplet(name) { return raw(name).split(",").map(Number); }
  function mix(a, b, t) { return "rgb(" + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",") + ")"; }

  function palette() {
    const dark = root.classList.contains("dark");
    const primaryVar = "--color-primary-" + (dark ? "300" : "600");
    const secondaryVar = "--color-secondary-" + (dark ? "300" : "600");
    const boxfillVar = "--color-neutral-" + (dark ? "700" : "100");
    return {
      accent: { primary: primaryVar, secondary: secondaryVar },
      accentTriplet: { primary: triplet(primaryVar), secondary: triplet(secondaryVar) },
      boxfillTriplet: triplet(boxfillVar),
      muted: rgb("--color-neutral-" + (dark ? "500" : "400")),
      boxfill: rgb(boxfillVar),
      text: rgb("--color-neutral-" + (dark ? "100" : "800")),
      sub: rgb("--color-neutral-" + (dark ? "400" : "500")),
      capbox: rgb("--color-neutral-" + (dark ? "900" : "200")),
    };
  }
  function accentColor(role, pal) { return rgb(pal.accent[role] || pal.accent.primary); }
  function accentTint(role, pal) {
    return mix(pal.boxfillTriplet, pal.accentTriplet[role] || pal.accentTriplet.primary, 0.35);
  }

  // ---- build static parts (wires + boxes) from config ----
  const wireG = document.getElementById("wires-" + uid);
  for (const w of cfg.wires) {
    const l = document.createElementNS(NS, "polyline");
    l.setAttribute("points", w.map((p) => p.join(",")).join(" "));
    wireG.appendChild(l);
  }
  const boxEls = {};
  const boxG = document.getElementById("boxes-" + uid);
  for (const [k, [x0, y0, x1, y1, label]] of Object.entries(cfg.boxes)) {
    const r = document.createElementNS(NS, "rect");
    Object.entries({ x: x0, y: y0, width: x1 - x0, height: y1 - y0, rx: 8 }).forEach(([a, v]) => r.setAttribute(a, v));
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", (x0 + x1) / 2);
    t.setAttribute("y", (y0 + y1) / 2);
    t.setAttribute("font-size", 13);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("dominant-baseline", "central");
    t.setAttribute("font-family", "ui-sans-serif, system-ui, sans-serif");
    t.textContent = label;
    boxG.append(r, t);
    boxEls[k] = { r, t, bounds: [x0, y0, x1, y1] };
  }

  // ---- helpers (path walking + easing, same math as the reference animation) ----
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  function pointOn(path, t) {
    const segs = path.slice(1).map((b, i) => [path[i], b, Math.hypot(b[0] - path[i][0], b[1] - path[i][1])]);
    let target = t * segs.reduce((s, x) => s + x[2], 0);
    const walked = [path[0]];
    for (const [a, b, l] of segs) {
      if (target <= l) {
        const r = l ? target / l : 0;
        const p = [a[0] + (b[0] - a[0]) * r, a[1] + (b[1] - a[1]) * r];
        walked.push(p);
        return [p, walked];
      }
      target -= l;
      walked.push(b);
    }
    return [path[path.length - 1], walked];
  }
  const inside = (p, b, pad = 4) => b[0] - pad <= p[0] && p[0] <= b[2] + pad && b[1] - pad <= p[1] && p[1] <= b[3] + pad;

  // ---- per-frame render ----
  const trail = document.getElementById("trail-" + uid);
  const dot = document.getElementById("dot-" + uid);
  const dotGlow = document.getElementById("dotglow-" + uid);
  const dotBody = document.getElementById("dotbody-" + uid);
  const dotLabel = document.getElementById("dotlabel-" + uid);
  const caption = document.getElementById("caption-" + uid);
  const capBox = document.getElementById("capbox-" + uid);
  const titleEl = document.getElementById("title-" + uid);
  const subtitleEl = document.getElementById("subtitle-" + uid);
  let lit = {};
  let pal = palette();

  function restyleStatic() {
    pal = palette();
    Array.from(wireG.children).forEach((w) => w.setAttribute("stroke", pal.muted));
    if (titleEl) titleEl.setAttribute("fill", pal.text);
    if (subtitleEl) subtitleEl.setAttribute("fill", pal.sub);
    capBox.setAttribute("fill", pal.capbox);
  }

  function render(f) {
    if (f === 0) lit = {};
    let active = null;
    trail.setAttribute("points", "");

    for (const mv of cfg.moves) {
      if (f >= mv.start && f <= mv.end) {
        const [p, walked] = pointOn(mv.path, ease((f - mv.start) / (mv.end - mv.start)));
        trail.setAttribute("points", walked.map((q) => q.join(",")).join(" "));
        trail.setAttribute("stroke", accentColor(mv.color, pal));
        active = { p, color: mv.color, label: mv.label };
        for (const [k, box] of Object.entries(boxEls)) {
          if (inside(p, box.bounds)) lit[k] = [f + 12, mv.color];
        }
      }
    }

    for (const [k, { r, t, bounds }] of Object.entries(boxEls)) {
      const on = lit[k] && lit[k][0] >= f;
      const role = on ? lit[k][1] : null;
      r.setAttribute("fill", on ? accentTint(role, pal) : pal.boxfill);
      r.setAttribute("stroke", on ? accentColor(role, pal) : pal.muted);
      r.setAttribute("stroke-width", on ? 2 : 1.5);
      t.setAttribute("fill", on ? pal.text : pal.sub);
    }

    const showDot = active && !Object.values(boxEls).some((box) => inside(active.p, box.bounds, 0));
    dot.setAttribute("visibility", showDot ? "visible" : "hidden");
    if (showDot) {
      dot.setAttribute("transform", "translate(" + active.p[0] + " " + active.p[1] + ")");
      const col = accentColor(active.color, pal);
      dotGlow.setAttribute("fill", col);
      dotBody.setAttribute("fill", col);
      dotLabel.setAttribute("fill", col);
      dotLabel.textContent = active.label || "";
    }

    const cap = cfg.captions.find((c) => f >= c.start && f < c.end);
    if (cap) {
      if (caption.textContent !== cap.text) {
        caption.textContent = cap.text;
        const w = caption.getComputedTextLength();
        capBox.setAttribute("x", 400 - w / 2 - 18);
        capBox.setAttribute("width", w + 36);
      }
      caption.setAttribute("fill", accentColor(cap.color, pal));
    }
  }

  // ---- loop, gated by visibility + prefers-reduced-motion ----
  const FPS = cfg.fps || 25;
  const TOTAL = cfg.totalFrames || 190;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let rafId = null;
  let start = null;

  function tick(now) {
    if (start === null) start = now;
    render(Math.floor(((now - start) / 1000) * FPS) % TOTAL);
    rafId = requestAnimationFrame(tick);
  }
  function play() {
    if (rafId !== null || reduced) return;
    start = null;
    rafId = requestAnimationFrame(tick);
  }
  function pause() {
    if (rafId === null) return;
    cancelAnimationFrame(rafId);
    rafId = null;
  }

  restyleStatic();
  if (reduced) {
    render(Math.floor(TOTAL * 0.3));
  } else {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => (e.isIntersecting ? play() : pause()));
    }, { threshold: 0.1 });
    io.observe(document.getElementById("moving-diagram-" + uid));
  }

  new MutationObserver(() => {
    restyleStatic();
    render(reduced ? Math.floor(TOTAL * 0.3) : Math.max(0, Math.floor(((performance.now() - (start || performance.now())) / 1000) * FPS) % TOTAL));
  }).observe(root, { attributes: true, attributeFilter: ["class"] });
})();
</script>
